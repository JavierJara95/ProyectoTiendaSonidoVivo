spring.application.name=ms-pedidos
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/sonido_vivo_pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
springdoc.swagger-ui.path=/swagger-ui.html
app.security.jwt-secret=${JWT_SECRET:}
app.catalogo.url=${CATALOGO_URL:http://localhost:8081}
