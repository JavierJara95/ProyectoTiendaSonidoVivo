spring.application.name=ms-catalogo
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/sonido_vivo_catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/swagger-ui.html
app.security.jwt-secret=${JWT_SECRET:}
