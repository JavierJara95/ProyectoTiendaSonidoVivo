# Configuración de referencia. Define estas variables en el entorno del proceso.
server.port=8083
spring.application.name=ms-usuarios-auth
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/sonidovivo_usuarios}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt-secret=${JWT_SECRET}
